# Hand-curated event reports (owner: Role A). Tracked in git like MANIFEST.yaml.
# Rule: every row quotes a place name exactly as it appears in the cited article; nothing is
# added from memory. Coordinates are NOT stored here: they come from OpenStreetMap Nominatim
# at build time (floodtwin.geo.observations) and are therefore locality-level, not the exact
# flooded spot -> confidence "low" by default.
# timestamp: article publication time (IST) = upper bound on observation time; or date only.
# depth_m_reported: converted from the article's units; "up to" values are maxima, not means.
events:
  - event_ref: "20170815"
    nominal_start_ist: "2017-08-14T18:00"   # ASSUMED: articles say "overnight"/"night of"; 18:00 IST chosen as nominal start for the Sentinel-1 window only
    description: Overnight 14-15 Aug 2017 rain, flooding reported 15 Aug 2017 (morning)
    rainfall_notes: "Not reported in cited article; other coverage cites IMD ~128.7 mm city station (not verified here)"
  - event_ref: "20220905"
    nominal_start_ist: "2022-09-04T18:00"   # ASSUMED: articles say "overnight"/"night of"; 18:00 IST chosen as nominal start for the Sentinel-1 window only
    description: Night of 4-5 Sep 2022, ORR / Mahadevapura / Bellandur flooding
    rainfall_notes: "Cited article: IMD 131 mm city overnight; KSNDMC Marathahalli 129 mm (to 03:15), Doddanekundi 125 mm (to 03:00), Bandikodagehalli 125 mm, HSR Layout 65 mm (to 03:30)"
  - event_ref: "20241021"
    nominal_start_ist: "2024-10-21T18:00"   # ASSUMED: articles say "overnight"/"night of"; 18:00 IST chosen as nominal start for the Sentinel-1 window only
    description: Night of 21-22 Oct 2024, north Bengaluru / Yelahanka flooding
    rainfall_notes: "Cited article gives no mm values; other coverage attributes ~190 mm Yelahanka to KSNDMC (not verified here)"
  - event_ref: "20250518"
    nominal_start_ist: "2025-05-18T18:00"   # ASSUMED: articles say "overnight"/"night of"; 18:00 IST chosen as nominal start for the Sentinel-1 window only
    description: Night of 18-19 May 2025 flooding
    rainfall_notes: "Cited article: IMD city 105.5 mm to 08:30 19 May; KSNDMC Kengeri 132 mm, GEO Campus 125.8 mm, Somashettihalli 119.5 mm, Madanayakanahalli 116.5 mm, Yelahanka Chowdeshwari 103.5 mm"

