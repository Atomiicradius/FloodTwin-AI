# DRAFT — Role B Phase 1 parameter ranges.
# Not frozen. Role C must review before these ranges are used for ensembles,
# and Role D may add a schema validator. See reports/b_phase1_parameter_ranges.md.

_meta:
  status: DRAFT
  version: "0.1.0-draft"
  owner: Role B (Hydraulic Modelling)
  created: "2026-11-11"
  schema: "context/reference/technical-specs.md §5.5"
  provenance_vocabulary: "context/data-and-contracts.md §7.5"
  review_required:
    - "Role C: review sampling ranges and interaction with ScenarioSpec"
    - "Role D: adopt or strip _meta when the ranges schema validator lands"
  note: >-
    Draft ranges only. Every group carries a provenance tag and a source note.
    ASSUMED groups are placeholders that must be replaced once Role A's audit,
    DEM products or field evidence exist. No range is a calibrated posterior.

conduit_diameter_m:
  unit: "m"
  min: 0.30
  max: 2.00
  distribution: uniform
  provenance: ASSUMED
  source_note: >-
    Public drainage KMLs carry no diameter or capacity attribute (expected per
    technical-specs §5.1). Range spans small municipal laterals to large trunk
    drains and is a placeholder to be replaced by Role A's audit, imagery or
    field measurements. Not a literature value.
  scope: all_links

invert_elevation_offset_m:
  unit: "m"
  min: -0.30
  max: 0.30
  distribution: uniform
  provenance: ASSUMED
  source_note: >-
    Invert elevations are absent from the public network and will be inferred
    from DEM-derived node elevations. Offset covers DEM vertical error and
    unknown burial depth / pipe cover. Replace with surveyed inverts where
    available and tag those MEASURED.
  scope: all_nodes

conduit_manning_n:
  unit: "s/m^(1/3)"
  min: 0.013
  max: 0.035
  distribution: uniform
  provenance: ESTIMATED
  source_note: >-
    Concrete sewer with manholes 0.013-0.017 and cemented rubble masonry
    0.018-0.030 (Chow 1959, reproduced in SWMM Reference Manual Vol. 2,
    Tables G-1 and G-2). Upper bound 0.035 allows for sediment, debris and
    encroachment in unmaintained drains.
  scope: all_links

blockage_fraction:
  unit: "fraction"
  min: 0.00
  max: 0.60
  distribution: uniform
  provenance: ASSUMED
  source_note: >-
    No blockage inventory exists. Range represents clear to heavily obstructed
    drains reported in complaints/news; it is not a probability and must not be
    read as one. Apply conditionally on evidence_status once Role A's
    reconciliation exists.
  scope: all_links

imperviousness:
  unit: "fraction"
  min: 0.40
  max: 0.95
  distribution: uniform
  provenance: ESTIMATED
  source_note: >-
    Land-use guideline values: residential 0.35-0.70, commercial 0.65-0.90,
    industrial ~0.75 (MHFD Urban Storm Drainage Criteria Manual Vol. 1,
    2024, Table 6-2). Range 0.40-0.95 covers a dense mixed Bengaluru
    catchment. Replace with Role A's land-cover or imagery estimate.
  scope: all_subcatchments

infiltration_green_ampt_conductivity_mm_per_hr:
  unit: "mm/hr"
  min: 0.3
  max: 29.9
  distribution: uniform
  provenance: ESTIMATED
  source_note: >-
    Saturated hydraulic conductivity ranges from 0.3 mm/hr (clay) to
    117.8 mm/hr (sand) across USDA soil textures (Rawls, Brakensiek & Miller
    1983; values read from the TUFLOW wiki reproduction, Table 1). Upper bound
    trimmed to 29.9 mm/hr (loamy sand) because the study catchments are
    urbanised and largely compacted.
  scope: all_subcatchments

infiltration_green_ampt_suction_mm:
  unit: "mm"
  min: 49.5
  max: 316.3
  distribution: uniform
  provenance: ESTIMATED
  source_note: >-
    Capillary suction head across USDA soil textures, 49.5-316.3 mm (Rawls,
    Brakensiek & Miller 1983; values read from the TUFLOW wiki reproduction,
    Table 1).
  scope: all_subcatchments

infiltration_green_ampt_initial_deficit:
  unit: "fraction"
  min: 0.05
  max: 0.40
  distribution: uniform
  provenance: ASSUMED
  source_note: >-
    Initial moisture deficit (porosity minus initial moisture). USDA porosity
    is 0.31-0.49 (Rawls et al. 1983), but antecedent moisture for a specific
    event is unknown. Bounds are an assumption; replace with local soil data or
    event antecedent rainfall once available.
  scope: all_subcatchments

rainfall_scale:
  unit: "fraction"
  min: 0.70
  max: 1.30
  distribution: uniform
  provenance: ASSUMED
  source_note: >-
    Covers gauge representativeness and 15-min aggregation error for a small
    catchment. No local bias study exists yet. This is not a calibrated
    multiplier and must not be reported as one.
  scope: all_events

outlet_condition_stage_m:
  unit: "m"
  min: 0.00
  max: 1.00
  distribution: uniform
  provenance: ASSUMED
  source_note: >-
    Outfall condition is unknown (free discharge vs partial submergence or
    backwater). Range 0-1 m above outfall invert spans free to submerged
    outlet. Verify from an outfall survey and tag MEASURED where observed.
  scope: all_outfalls

status_capacity_factor:
  unit: "fraction"
  min: 0.20
  max: 1.00
  distribution: uniform
  provenance: ASSUMED
  source_note: >-
    Schema-only placeholder for DISPUTED or UNVERIFIED links: a capacity
    multiplier applied conditional on evidence_status. No real segment is
    listed here; Role A's audit must supply targets. Use equal weights or
    scenario-frequency reporting; do not claim a probability.
  scope: disputed_links
